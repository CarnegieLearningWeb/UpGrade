[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "upgrade-client-lib"
version = "6.7.0"
description = "Python client library for the UpGrade experimentation platform"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Carnegie Learning", email = "upgrade@carnegielearning.com" }]
requires-python = ">=3.9"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.0",
]

[project.urls]
Homepage = "https://github.com/CarnegieLearningWeb/UpGrade"
Repository = "https://github.com/CarnegieLearningWeb/UpGrade"
Issues = "https://github.com/CarnegieLearningWeb/UpGrade/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.4",
  "mypy>=1.10",
  "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/upgrade_client_lib"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["upgrade_client_lib"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
strict = true
python_version = "3.9"
files = ["src"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=upgrade_client_lib --cov-report=term-missing"
