<ng-container matColumnDef>
  <th mat-header-cell *matHeaderCellDef class="batch-select-column">
    <!-- Any selection makes the next click clear; indeterminate supplies the mixed appearance. -->
    <mat-checkbox
      class="batch-checkbox"
      [disableRipple]="true"
      color="primary"
      [checked]="!!selection?.selectedCount"
      [indeterminate]="selection?.indeterminate"
      [disabled]="!selection?.canToggleHeader"
      [aria-label]="(selection?.selectedCount ? 'batch.selection.clear' : 'batch.selection.select-loaded') | translate"
      matTooltipPosition="above"
      [matTooltip]="(selection?.selectedCount ? 'batch.selection.clear' : 'batch.selection.select-loaded') | translate"
      (click)="$event.stopPropagation()"
      (keydown)="$event.stopPropagation()"
      (change)="batch.toggleHeader()"
    />
  </th>
  <td mat-cell *matCellDef="let row" class="batch-select-column">
    <mat-checkbox
      class="batch-checkbox"
      [disableRipple]="true"
      color="primary"
      [checked]="!!batchState?.selectedById[row.id]"
      [disabled]="selection?.busy || !selection?.loadedIds.has(row.id)"
      [aria-label]="rowLabelKey | translate : { name: row.name }"
      (click)="$event.stopPropagation()"
      (keydown)="$event.stopPropagation()"
      (change)="batch.toggleRow(row)"
    />
  </td>
</ng-container>
