<div class="footer-container">
  <mat-tab-group
    mat-stretch-tabs="false"
    mat-align-tabs="start"
    animationDuration="250ms"
    [selectedIndex]="selectedIndex"
    (selectedTabChange)="onSelectedTabChange($event)"
    class="new-tab-group"
  >
    <!-- Track by label so re-emitted label arrays (new object identities, same content) reuse the
         existing mat-tabs. Recreating them makes MatTabGroup re-emit selectedTabChange, which would
         trigger a tab query-param navigation that cancels any in-flight route navigation. -->
    @for (tab of tabLabels; track tab.label) {
    <mat-tab [disabled]="tab.disabled">
      <ng-template mat-tab-label>
        <span class="ft-18-600">
          {{ tab.label }}
        </span>
      </ng-template>
    </mat-tab>
    }
  </mat-tab-group>
</div>
